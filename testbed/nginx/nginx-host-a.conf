events { worker_connections 1024; }

http {
    server {
        listen 80;
        server_name api.aiori.lab aiori.lab;

        location / {
            default_type application/json;
            return 200 '{"status":"healthy","service":"api.aiori.lab","tier":"production","ports":[80,443]}\n';
        }
    }

    server {
        listen 443 ssl;
        server_name api.aiori.lab aiori.lab;

        ssl_certificate /etc/nginx/certs/healthy.crt;
        ssl_certificate_key /etc/nginx/certs/healthy.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            default_type application/json;
            return 200 '{"status":"healthy","service":"api.aiori.lab","tls":"valid","ports":[80,443]}\n';
        }
    }
}
