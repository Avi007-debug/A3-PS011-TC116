events { worker_connections 1024; }

http {
    server {
        listen 443 ssl;
        server_name legacy.aiori.lab;

        ssl_certificate /etc/nginx/certs/expired.crt;
        ssl_certificate_key /etc/nginx/certs/expired.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            default_type application/json;
            return 200 '{"status":"legacy","service":"legacy.aiori.lab","warning":"expired_cert","seed":"TEST-SEED-01"}\n';
        }
    }
}
